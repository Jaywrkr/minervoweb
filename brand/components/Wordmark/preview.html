<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Wordmark — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-sans);}
  .row{display:flex;gap:var(--space-3);padding:var(--space-3);align-items:stretch;flex-wrap:wrap;}
  .tile{flex:1 1 200px;height:160px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);}
  .t-ground{background:var(--surface-raised);}
  .t-violeta{background:var(--violeta);color:var(--white);}
  .wm{font-weight:500;font-size:34px;letter-spacing:-.02em;}
  .dot{color:var(--punto);}
  .avatar{flex:0 0 160px;}
  .av{width:112px;height:112px;border-radius:var(--radius-pill);background:var(--ground);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:500;color:var(--ink);}
</style>
</head>
<body>
<div class="row">
  <div class="tile t-ground"><span class="wm">minərvo<span class="dot">.</span>studio</span></div>
  <div class="tile t-violeta"><span class="wm">minərvo<span class="dot">.</span>studio</span></div>
  <div class="tile t-ground avatar"><div class="av">ə<span class="dot">.</span></div></div>
</div>
</body>
</html>
