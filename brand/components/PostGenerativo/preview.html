<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Post · Generativo — preview</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:var(--ground);font-family:var(--font-sans);}
  .row{display:flex;flex-wrap:wrap;gap:var(--space-3);padding:var(--space-3);}
  .post{width:272px;height:340px;position:relative;overflow:hidden;}
  .post svg{display:block;}
  .stripe{fill:#0b0b0d}
  .violeta{fill:var(--violeta)} .rosa{fill:var(--rosa)} .naranja{fill:var(--naranja)}
  .mostaza{fill:var(--mostaza)} .menta{fill:var(--menta)} .verde{fill:var(--verde)}
  .p2{background:#0b0b0d;}
  .wm{position:absolute;left:0;right:0;bottom:var(--space-3);text-align:center;color:#f3f0e8;font-weight:500;font-size:14px;}
  .dot{color:var(--punto);}
  .tag{position:absolute;left:var(--space-3);top:var(--space-3);font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#9c9aa2;}
</style>
</head>
<body>
<div class="row">
  <div class="post" style="background:#e8e6e1">
    <svg width="272" height="340" viewBox="0 0 272 340">
      <g id="s"></g>
      <rect class="naranja" x="0" y="64" width="48" height="48"/>
      <rect class="mostaza" x="48" y="128" width="48" height="32"/>
      <rect class="rosa" x="112" y="72" width="40" height="96"/>
      <rect class="violeta" x="136" y="176" width="32" height="88"/>
      <rect class="menta" x="168" y="96" width="32" height="80"/>
      <rect class="mostaza" x="184" y="64" width="56" height="64"/>
      <rect class="menta" x="184" y="208" width="72" height="56"/>
      <rect class="violeta" x="128" y="32" width="40" height="16"/>
      <rect class="rosa" x="80" y="224" width="24" height="24"/>
      <rect class="naranja" x="168" y="264" width="40" height="24"/>
    </svg>
  </div>
  <div class="post p2">
    <span class="tag">exp. 012 · p5.js</span>
    <svg width="272" height="340" viewBox="0 0 272 340">
      <circle class="violeta" cx="104" cy="150" r="72"/>
      <circle class="rosa" cx="176" cy="132" r="44"/>
      <rect class="mostaza" x="64" y="226" width="144" height="28" rx="14"/>
      <path class="verde" d="M168 186 L232 216 L168 246 Z"/>
      <circle cx="86" cy="96" r="18" fill="none" stroke="var(--naranja)" stroke-width="10"/>
    </svg>
    <span class="wm">minərvo<span class="dot">.</span>studio</span>
  </div>
</div>
<script>
  // franjas op-art: alto space-2, paso space-3, alternando columnas desfasadas
  var g=document.getElementById('s'),ns='http://www.w3.org/2000/svg';
  for(var c=0;c<8;c++){for(var y=0;y<340;y+=16){var r=document.createElementNS(ns,'rect');
    r.setAttribute('class','stripe');r.setAttribute('x',c*34);r.setAttribute('y',y+(c%2?8:0));
    r.setAttribute('width',34);r.setAttribute('height',8);g.appendChild(r);}}
</script>
</body>
</html>
