<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Post · Manifiesto — preview</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:var(--ground);}
  .row{display:flex;flex-wrap:wrap;gap:var(--space-3);padding:var(--space-3);}
  .post{width:272px;height:340px;box-sizing:border-box;padding:var(--space-4) var(--space-3);display:flex;flex-direction:column;justify-content:space-between;color:var(--on-color);overflow:hidden;}
  .m{font-family:var(--font-poster);font-size:38px;line-height:.92;text-transform:uppercase;margin:0;}
  .wm{font-family:var(--font-sans);font-weight:500;font-size:12px;}
  .dot{color:var(--violeta);}
</style>
</head>
<body>
<div class="row">
  <div class="post" style="background:var(--menta)">
    <p class="m">La creatividad no espera el momento perfecto. Lo crea.</p>
    <span class="wm">minərvo<span class="dot">.</span>studio</span>
  </div>
  <div class="post" style="background:var(--rosa)">
    <p class="m">Hacemos webs que se sienten.</p>
    <span class="wm">minərvo<span class="dot">.</span>studio</span>
  </div>
</div>
</body>
</html>
