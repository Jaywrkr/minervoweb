<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Formas — preview</title>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:var(--ground);color:var(--ink-muted);font-family:var(--font-mono);}
  .row{display:flex;flex-wrap:wrap;gap:var(--space-5);padding:var(--space-4);align-items:flex-end;}
  figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:var(--space-2);}
  figcaption{font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;}
  .violeta{fill:var(--violeta)} .rosa{fill:var(--rosa)} .naranja{fill:var(--naranja)}
  .mostaza{fill:var(--mostaza)} .menta{fill:var(--menta)} .verde{fill:var(--verde)}
  .dona{fill:none;stroke:var(--naranja);stroke-width:22px}
</style>
</head>
<body>
<div class="row">
  <figure><svg width="88" height="88" viewBox="0 0 88 88"><circle class="menta" cx="44" cy="44" r="44"/></svg><figcaption>círculo</figcaption></figure>
  <figure><svg width="88" height="88" viewBox="0 0 88 88"><circle class="dona" cx="44" cy="44" r="33"/></svg><figcaption>dona</figcaption></figure>
  <figure><svg width="88" height="88" viewBox="0 0 88 88"><path class="mostaza" d="M0 32 A44 44 0 0 0 88 32 Z"/></svg><figcaption>media luna</figcaption></figure>
  <figure><svg width="88" height="88" viewBox="0 0 88 88"><path class="verde" d="M8 8 L84 44 L8 84 Z"/></svg><figcaption>triángulo</figcaption></figure>
  <figure><svg width="120" height="88" viewBox="0 0 120 88"><rect class="rosa" x="0" y="28" width="120" height="32" rx="16"/></svg><figcaption>píldora</figcaption></figure>
  <figure><svg width="88" height="88" viewBox="0 0 88 88"><rect class="violeta" x="0" y="0" width="88" height="88"/></svg><figcaption>cuadrado</figcaption></figure>
</div>
</body>
</html>
