<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Post · Frase — preview</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:var(--ground);font-family:var(--font-sans);}
  .row{display:flex;flex-wrap:wrap;gap:var(--space-3);padding:var(--space-3);}
  .post{width:272px;height:340px;box-sizing:border-box;padding:var(--space-4) var(--space-3);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative;}
  .f{font-size:30px;line-height:1.02;font-weight:500;letter-spacing:-.025em;margin:0;}
  .label{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;}
  .p1{background:var(--rosa);color:var(--on-color);}
  .p2{background:#0b0b0d;color:var(--rosa);}
  .p2 .label{color:#9c9aa2;}
</style>
</head>
<body>
<div class="row">
  <div class="post p1">
    <span class="label">minərvo.studio · 2026</span>
    <p class="f">experiencias<br>que se mueven.</p>
    <svg width="80" height="40" viewBox="0 0 80 40" aria-hidden="true"><rect x="0" y="8" width="56" height="24" rx="12" fill="var(--violeta)"/><circle cx="68" cy="20" r="12" fill="var(--naranja)"/></svg>
  </div>
  <div class="post p2">
    <span class="label">nota 07</span>
    <p class="f">si no se siente,<br>no es una<br>experiencia.</p>
    <span class="label">minərvo.studio</span>
  </div>
</div>
</body>
</html>
